services:
  db:
    image: pgvector/pgvector:pg16
    container_name: eacip-db
    environment:
      POSTGRES_USER: eacip
      POSTGRES_PASSWORD: eacip_dev_password
      POSTGRES_DB: eacip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eacip"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: eacip-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://eacip:eacip_dev_password@db:5432/eacip
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: eacip-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data: